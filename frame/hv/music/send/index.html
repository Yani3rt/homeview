<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Send music to Sonos</title>
<!-- Phone page behind the Music screen's QR. Pick a room, paste a Spotify link, it plays through Sonos via
     POST /api/frame/music {room, action:'spotify', link} (same-origin, so the server's Origin check passes).
     The server accepts track, album, playlist, podcast (show) and episode links; artist links are refused. -->
<style>
  :root{--bg:#14110f;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--ink:#f6f1ea;--muted:rgba(246,241,234,.62);--accent:#1ed760;--bad:#ef7d6d}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 32px)}
  h1{margin:0;font-size:32px;line-height:1.05;letter-spacing:-.02em}
  .sub{margin:8px 0 22px;color:var(--muted)}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
  #rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #rooms button{min-height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;text-align:left;padding:10px 14px}
  #rooms button small{display:block;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rooms button.on{background:var(--ink);color:#14110f;border-color:var(--ink)}
  #rooms button.on small{color:rgba(20,17,15,.6)}
  textarea{width:100%;min-height:96px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:14px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:10px}
  button.go{flex:1;min-height:64px;border:0;border-radius:20px;background:var(--accent);color:#06210f;font:inherit;font-weight:800;font-size:20px}
  button.paste{min-height:64px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:0 18px}
  button:disabled{opacity:.45}
  .status{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:none}
  .status.show{display:block}.status.bad{border-color:var(--bad)}
  .hint{color:var(--muted);font-size:14px;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>Play on Sonos</h1>
  <p class="sub">In Spotify, tap Share, then Copy link. Paste it here.</p>
  <h2>Room</h2>
  <div id="rooms"><span class="hint">Finding your rooms…</span></div>
  <h2>Spotify link</h2>
  <textarea id="link" placeholder="https://open.spotify.com/…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="row"><button class="paste" id="paste" type="button">Paste</button><button class="go" id="go" type="button" disabled>Play</button></div>
  <div class="status" id="status"></div>
  <p class="hint">Songs, albums, playlists, podcasts and episodes work. It adds to the room's Sonos queue and starts playing.</p>
</main>
<script>
(function(){
  var room=null,rooms=[];
  function $(i){return document.getElementById(i);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function say(t,bad){var s=$('status');s.textContent=t;s.className='status show'+(bad?' bad':'');}
  function link(){var m=$('link').value.match(/(https:\/\/open\.spotify\.com\/\S+|spotify:[a-z]+:[A-Za-z0-9]+)/);return m?m[1]:'';}
  function ready(){$('go').disabled=!(room&&link());}
  function draw(){
    $('rooms').innerHTML=rooms.length?rooms.map(function(r){return '<button data-r="'+esc(r.id)+'" class="'+(r.id===room?'on':'')+'">'+esc(r.name)+
      '<small>'+esc(r.title?r.title:r.state==='PLAYING'?'Playing':'Nothing playing')+'</small></button>';}).join(''):'<span class="hint">No Sonos rooms answered.</span>';
  }
  fetch('/api/frame/music',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    rooms=(d.rooms||[]).filter(function(r){return r.ok;});
    var p=null;rooms.forEach(function(r){if(!p&&r.state==='PLAYING')p=r;});room=(p||rooms[0]||{}).id||null;draw();ready();
  },function(){$('rooms').innerHTML='<span class="hint">The server did not answer. Is this phone on the same Wi-Fi?</span>';});
  $('rooms').onclick=function(e){var b=e.target.closest('[data-r]');if(!b)return;room=b.getAttribute('data-r');draw();ready();};
  $('link').oninput=ready;
  $('paste').onclick=function(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){$('link').value=t;ready();},function(){say('Long-press the box and choose Paste.');});
    else say('Long-press the box and choose Paste.');};
  $('go').onclick=function(){
    var l=link();if(!l||!room)return;$('go').disabled=true;say('Sending…');
    fetch('/api/frame/music',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:room,action:'spotify',link:l})})
      .then(function(r){return r.json().catch(function(){return {ok:false,error:'HTTP '+r.status};});})
      .then(function(d){if(d.ok){var n='';rooms.forEach(function(r){if(r.id===room)n=r.name;});say('Playing on '+n+'.');$('link').value='';}else say(d.error||'That did not work',true);},
            function(){say('The server did not answer.',true);}).then(ready);
  };
})();
</script>
</body>
</html>

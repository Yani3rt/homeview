<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Background</title>
<link rel="stylesheet" href="/frame/hv/hv.css?v=7">
<link rel="stylesheet" href="/frame/hv/background/background.css?v=1">
</head>
<body>
<main class="hv-screen bg-pg">
  <header><h1 class="hv-title round">Background</h1><div class="hv-sub">This frame only. Pick a look, then a color or a wallpaper.</div></header>
  <div class="bg-cols">
    <section class="bg-left">
      <div class="bg-look" id="look"></div>
      <div class="bg-prev" id="prev"><div class="pt"><b id="pclock">11:52</b><span>Preview</span></div><div class="pg"><i></i><i></i><i></i></div></div>
    </section>
    <section class="bg-right">
      <h3 class="bg-h">Color</h3>
      <div class="bg-sw" id="sw"></div>
      <h3 class="bg-h">Wallpapers <span id="wcount"></span></h3>
      <div class="bg-wp" id="wp"></div>
    </section>
  </div>
</main>
<script src="/frame/hv/config.js"></script>
<script src="/frame/shared/cond.js?v=1"></script>
<script src="/frame/hv/hv.js?v=10"></script>
<script src="/frame/hv/faces/sched.js?v=3"></script>
<script src="/frame/hv/background/background.js?v=1"></script>
</body>
</html>
